<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="seaH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2740"/>
      <stop offset="100%" stop-color="#071a2c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#seaH2)"/>
  <path d="M0 220 Q 50 210 100 220 T 200 220 T 300 220 T 400 220" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none"/>

  <!-- both alter to starboard: top vessel (heading down) bends left on screen = her starboard;
       bottom vessel (heading up) bends right on screen = her starboard -->
  <path d="M200,60 C 200,90 165,100 150,120 C 138,138 138,160 150,195" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200,200 C 200,170 235,160 250,140 C 262,122 262,100 250,65" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <g transform="translate(200,60) rotate(195)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(200,200) rotate(-15)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#38bdf8"/>
  </g>

  <g font-family="sans-serif" font-weight="700" font-size="13">
    <rect x="94" y="14" width="212" height="24" rx="12" fill="#38bdf8"/>
    <text x="200" y="30.5" text-anchor="middle" fill="#052e3f">BOTH turn to starboard</text>
  </g>
  <text x="200" y="248" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">
    → pass port side to port side
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="seaC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2740"/>
      <stop offset="100%" stop-color="#071a2c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#seaC)"/>
  <!-- gentle wave lines -->
  <path d="M0 220 Q 50 210 100 220 T 200 220 T 300 220 T 400 220" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none"/>
  <path d="M0 236 Q 50 226 100 236 T 200 236 T 300 236 T 400 236" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" fill="none"/>

  <!-- projected tracks (dashed, neutral) -->
  <line x1="300" y1="70" x2="110" y2="250" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.6"/>
  <line x1="55" y1="210" x2="330" y2="70" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.6"/>

  <!-- crossing point marker -->
  <g transform="translate(196,150)">
    <circle r="16" fill="#f59e0b" opacity="0.15"/>
    <path d="M0,-9 L8,7 L-8,7 Z" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- vessel A (top area, heading down-left) -->
  <g transform="translate(300,70) rotate(225)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#e5e7eb"/>
  </g>
  <!-- vessel B (bottom-left, heading up-right) -->
  <g transform="translate(55,210) rotate(45)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#e5e7eb"/>
  </g>

  <text x="200" y="30" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="600">
    Two vessels, crossing courses
  </text>
</svg>

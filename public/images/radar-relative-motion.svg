<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#0a0c14"/>
  <circle cx="200" cy="170" r="130" fill="none" stroke="#1f2937" stroke-width="1"/>
  <circle cx="200" cy="170" r="90" fill="none" stroke="#1f2937" stroke-width="1"/>
  <circle cx="200" cy="170" r="50" fill="none" stroke="#1f2937" stroke-width="1"/>
  <line x1="200" y1="40" x2="200" y2="300" stroke="#1f2937" stroke-width="1"/>
  <line x1="70" y1="170" x2="330" y2="170" stroke="#1f2937" stroke-width="1"/>
  <!-- own ship at centre -->
  <circle cx="200" cy="170" r="6" fill="#38bdf8"/>
  <text x="200" y="150" fill="#38bdf8" font-family="sans-serif" font-size="12" text-anchor="middle">OS</text>
  <!-- relative motion line (RML) from target through CPA -->
  <line x1="330" y1="60" x2="120" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="330" cy="60" r="6" fill="#f59e0b"/>
  <text x="340" y="55" fill="#f59e0b" font-family="sans-serif" font-size="12">T (now)</text>
  <!-- CPA point -->
  <circle cx="200" cy="170" r="0" />
  <line x1="200" y1="170" x2="182" y2="188" stroke="#ef4444" stroke-width="2"/>
  <circle cx="182" cy="188" r="5" fill="#ef4444"/>
  <text x="150" y="205" fill="#ef4444" font-family="sans-serif" font-size="12">CPA</text>
  <text x="200" y="300" fill="#9ca3af" font-family="sans-serif" font-size="13" text-anchor="middle">
    Relative Motion Line (RML): dotted = target's plotted track relative to own ship
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0c14"/>
  <ellipse cx="200" cy="230" rx="140" ry="18" fill="#111827"/>
  <path d="M70 230 L100 150 L300 150 L330 230 Z" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="150" y="90" width="14" height="60" fill="#374151"/>
  <rect x="250" y="70" width="14" height="80" fill="#374151"/>
  <!-- Masthead lights (white, forward lower / aft higher) -->
  <circle cx="157" cy="88" r="7" fill="#e5e7eb"/>
  <circle cx="257" cy="68" r="7" fill="#e5e7eb"/>
  <!-- glow -->
  <circle cx="157" cy="88" r="16" fill="#e5e7eb" opacity="0.25"/>
  <circle cx="257" cy="68" r="16" fill="#e5e7eb" opacity="0.25"/>
  <!-- Sidelights -->
  <circle cx="100" cy="150" r="7" fill="#ef4444"/>
  <circle cx="100" cy="150" r="16" fill="#ef4444" opacity="0.25"/>
  <circle cx="300" cy="150" r="7" fill="#22c55e"/>
  <circle cx="300" cy="150" r="16" fill="#22c55e" opacity="0.25"/>
  <!-- Sternlight -->
  <circle cx="80" cy="205" r="6" fill="#e5e7eb"/>
  <circle cx="80" cy="205" r="14" fill="#e5e7eb" opacity="0.25"/>
  <text x="200" y="270" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">
    Power-driven vessel underway ≥50m: 2 masthead + sidelights + stern
  </text>
</svg>

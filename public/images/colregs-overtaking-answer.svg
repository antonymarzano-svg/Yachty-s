<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="seaO2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2740"/>
      <stop offset="100%" stop-color="#071a2c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#seaO2)"/>
  <path d="M0 220 Q 50 210 100 220 T 200 220 T 300 220 T 400 220" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none"/>

  <path d="M200,150 L340,90 A 160 160 0 0 1 340,210 Z" fill="#fbbf24" opacity="0.10"/>

  <!-- leading vessel keeps course, drawn green (stand-on) -->
  <line x1="200" y1="150" x2="330" y2="150" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6"/>
  <g transform="translate(200,150) rotate(90)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#34d399"/>
  </g>

  <!-- overtaking vessel (amber) swings out and passes clear, then regains track -->
  <path d="M90,150 C 130,150 150,110 200,100 C 250,90 290,105 320,140" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g transform="translate(90,150) rotate(90)">
    <path d="M0,-16 L10,12 L0,6 L-10,12 Z" fill="#fbbf24"/>
  </g>

  <g font-family="sans-serif" font-weight="700" font-size="13">
    <rect x="16" y="14" width="112" height="24" rx="12" fill="#fbbf24"/>
    <text x="72" y="30.5" text-anchor="middle" fill="#052e16">OVERTAKING</text>

    <rect x="308" y="14" width="76" height="24" rx="12" fill="#34d399"/>
    <text x="346" y="30.5" text-anchor="middle" fill="#052e16">AHEAD</text>
  </g>
</svg>
